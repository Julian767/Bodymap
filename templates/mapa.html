{% extends "base.html" %}

{% block title %}Mapa Corporal Interactivo - BodyMap{% endblock %}

{% block content %}
<h2>Mapa Corporal</h2>

<div class="mapa-container">
    <img src="{{ url_for('static', filename='cuerpo.png') }}" alt="Cuerpo humano" style="width:100%;">

    <div class="zona" data-zone="cabeza" role="button" tabindex="0" aria-label="Cabeza"
         style="top: 10%; left: 35%; width: 30%; height: 10%;"></div>
    <div class="zona" data-zone="cuello" role="button" tabindex="0" aria-label="Cuello"
         style="top: 20%; left: 38%; width: 24%; height: 8%;"></div>
    <div class="zona" data-zone="pecho" role="button" tabindex="0" aria-label="Pecho"
         style="top: 28%; left: 30%; width: 40%; height: 15%;"></div>
    <div class="zona" data-zone="abdomen" role="button" tabindex="0" aria-label="Abdomen"
         style="top: 43%; left: 30%; width: 40%; height: 15%;"></div>
    <div class="zona" data-zone="brazo" role="button" tabindex="0" aria-label="Brazo izquierdo"
         style="top: 28%; left: 15%; width: 15%; height: 30%;"></div>
    <div class="zona" data-zone="brazo" role="button" tabindex="0" aria-label="Brazo derecho"
         style="top: 28%; left: 70%; width: 15%; height: 30%;"></div>
    <div class="zona" data-zone="pierna" role="button" tabindex="0" aria-label="Piernas"
         style="top: 58%; left: 35%; width: 30%; height: 25%;"></div>
</div>

<section class="info-zona">
    <h3>Información de la zona seleccionada</h3>
    <p id="infoZona">Haz clic o pasa el ratón sobre una parte del cuerpo para ver información.</p>
</section>
{% endblock %}
